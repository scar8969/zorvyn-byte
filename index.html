    <meta charset="UTF-8" />

    <meta name="description" content="Zorvyn helps startups and SMEs build secure, compliant, and intelligent financial systems. Custom financial architectures with AI-enabled solutions for budgeting, payments, compliance, and forecasting.">
    <meta name="keywords" content="Zorvyn, fintech, financial technology, compliance, budgeting, payments, forecasting, transaction monitoring, SME, startups, financial systems, AI finance">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Zorvyn">
    <meta property="og:locale" content="en_US">
    <meta property="og:title" content="Zorvyn | Secure Financial Systems">
    <meta property="og:description" content="Zorvyn helps startups and SMEs build secure, compliant, and intelligent financial systems.">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Zorvyn | Secure Financial Systems">
    <meta name="twitter:description" content="Zorvyn helps startups and SMEs build secure, compliant, and intelligent financial systems.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link id="favicon" rel="icon" type="image/png" href="/zorvynlogolight.png">
    <script>
      (function() {
        var lightIcon = '/zorvynlogodark.png';
        var darkIcon  = '/zorvynlogolight.png';
        var link = document.querySelector('link#favicon');
        function isDark() {
          var html = document.documentElement;
          if (html && html.classList) {
            if (html.classList.contains('dark')) return true;
            if (html.classList.contains('light')) return false;
          }
          return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        }
        function apply() { link.href = isDark() ? darkIcon : lightIcon; }
        apply();
        if (window.matchMedia) {
          var mq = window.matchMedia('(prefers-color-scheme: dark)');
          if (mq && mq.addEventListener) mq.addEventListener('change', apply);
        }
        if (window.MutationObserver) {
          var obs = new MutationObserver(function(mutations){
            for (var i=0;i<mutations.length;i++) {
              if (mutations[i].attributeName === 'class') { apply(); break; }
            }
          });
          obs.observe(document.documentElement, { attributes: true });
        }
      })();
    </script>
  </head>
  <body class="bg-background text-foreground">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
